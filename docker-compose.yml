services:
  app:
    build:
      context: .
      dockerfile: Dockerfile  # Using UV for fast dependency installation
    container_name: fastapi_app
    restart: unless-stopped
    environment:
      - PROJECT_NAME=FastAPI App
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
    volumes:
      - ./app:/app/app
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: fastapi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - fastapi_network

networks:
  fastapi_network:
    driver: bridge

